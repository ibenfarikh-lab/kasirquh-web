<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Back Test</title></head>
<body>
<h1>Back Button Test</h1>
<button id="openBtn">Buka Sheet</button>
<div id="sheet" style="display:none;border:2px solid orange;padding:20px;margin:20px;">
  <p>Sheet terbuka</p>
  <button id="closeBtn">Tutup (×)</button>
</div>
<p id="log"></p>
<hr>
<h2>Cek Integrasi Aplikasi</h2>
<p>Buka <a href="/index.html" target="_blank">aplikasi utama</a>, buka console, ketik <code>kqDebugStatus()</code></p>
<p>Atau: <button id="checkBtn">Cek via iframe</button></p>
<iframe id="appframe" src="/index.html?fresh=dbg" style="width:1px;height:1px;border:0"></iframe>
<p id="intlog"></p>
<script>
document.getElementById('checkBtn').onclick = function(){
  var f = document.getElementById('appframe');
  try {
    var st = f.contentWindow.kqDebugStatus();
    document.getElementById('intlog').textContent = 'Status integrasi: ' + st;
  } catch(e) {
    document.getElementById('intlog').textContent = 'Gagal cek: ' + e.message;
  }
};
</script>
<script>
var kqDepth = 0, kqIgnore = false;
function log(m){ document.getElementById('log').innerHTML += m + '<br>'; }
function push(){ kqDepth++; try { history.pushState({t:1}, ''); log('pushState OK, depth='+kqDepth); } catch(e){ log('pushState FAIL: '+e); } }
function drop(){ if(kqDepth<=0) return; kqDepth--; kqIgnore=true; try{ history.back(); }catch(e){ kqIgnore=false; } setTimeout(function(){kqIgnore=false;},600); log('drop, depth='+kqDepth); }
window.addEventListener('popstate', function(){
  if(kqIgnore){ kqIgnore=false; log('popstate ignored'); return; }
  if(kqDepth>0) kqDepth--;
  log('popstate, depth='+kqDepth);
  var s = document.getElementById('sheet');
  if(s.style.display !== 'none'){ s.style.display='none'; log('sheet closed by back'); }
});
document.getElementById('openBtn').onclick = function(){
  document.getElementById('sheet').style.display='block'; push();
};
document.getElementById('closeBtn').onclick = function(){
  document.getElementById('sheet').style.display='none'; drop();
};
log('ready, history.length='+history.length);
</script>
</body></html>
